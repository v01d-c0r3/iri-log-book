name: Build log book PDF

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with latexmk (pdfLaTeX + biber)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_pdflatex: true
          work_in_root_file_dir: true

      - name: Rename PDF
        run: cp main.pdf IRI_Log_Book.pdf

      - name: Upload PDF artefact
        uses: actions/upload-artifact@v4
        with:
          name: IRI_Log_Book
          path: IRI_Log_Book.pdf

      - name: Attach PDF to release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: IRI_Log_Book.pdf
